<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Sports77HD - Live Stream</title>

  <!-- HLS.js Library untuk memutar format .m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: #fff;
    }

    /* STREAM PLAYER */
    .stream-box {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 300px;
      background: #000;
      overflow: hidden;
    }

    .stream-box video {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    /* OVERLAY IKLAN CLICKUNDER */
    #ad-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #ad-overlay.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <!-- STREAM CONTAINER -->
  <main class="stream-box">
    <video id="video-player" controls autoplay playsinline></video>
    <div id="ad-overlay" role="button" aria-label="Lanjutkan ke video"></div>
  </main>

  <script>
    /* =========================
       DAFTAR PERTANDINGAN / STREAM
       ========================= */
    const matches = {
      "player1": { title: "player", src: "https://stream.kingbokep.video/kolpri-kak-anjani-pemain-basket/playlist.m3u8" },
      "player2": { title: "player", src: "https://cdn.aceimg.com/ubJO6kO42.mp4" },
      "player3": { title: "player", src: "https://cdn.aceimg.com/826XWyBMo.mp4" },
      "player4": { title: "player", src: "https://cdn.aceimg.com/bnmNv3Ts3.mp4" },
      "player5": { title: "ucl", src: "https://cdn.aceimg.com/sFAvLimyG.mp4" },
      "player6": { title: "ucl5", src: "https://cdn.aceimg.com/IZqW6KP5t.mp4" },
      "player7": { title: "ucl5", src: "https://cdn.aceimg.com/jXXuHj71u.mp4" },
      "player8": { title: "ucl", src: "https://cdn.aceimg.com/2YC18Lrfn.mp4" },
      "player9": { title: "mls", src: "https://cdn.aceimg.com/eJVWRDKu3.mp4" },
      "player10": { title: "arsenal", src: "https://sabutv.com/server/event.m3u8?ch=32&proxy=1" },
      "tnt3": { title: "psg", src: "https://sabutv.com/server/event.m3u8?ch=33&proxy=1" },
      "tnt1": { title: "ipul backup", src: "https://sabutv.com/server/event.m3u8?ch=31&proxy=1" },
      "barka": { title: "UCLbackup", src: "https://sabutv.com/server/event.m3u8?ch=33&proxy=1" }
    };

    /* =========================
       PARSING PARAMETER URL (?id=)
       ========================= */
    const params = new URLSearchParams(window.location.search);
    const matchId = (params.get("id") || "").trim().toLowerCase();

    const fallbackMatch = { title: "Live Stream", src: "" };
    const activeMatch = matches[matchId] || fallbackMatch;

    /* =========================
       PEMUTARAN VIDEO
       ========================= */
    const video = document.getElementById("video-player");

    if (activeMatch.src) {
      if (activeMatch.src.includes(".m3u8")) {
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(activeMatch.src);
          hls.attachMedia(video);
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          // Dukungan native untuk Safari / iOS
          video.src = activeMatch.src;
        }
      } else {
        // Direct stream file .mp4
        video.src = activeMatch.src;
      }
    }

    // Update judul halaman
    document.title = "RedFlix - " + activeMatch.title;
    const pageTitleEl = document.getElementById("page-title");
    if (pageTitleEl) {
      pageTitleEl.textContent = "RedFlix - " + activeMatch.title;
    }

    /* =========================
       IKLAN SHOPEE (CLICKUNDER)
       ========================= */
    const overlay = document.getElementById("ad-overlay");
    const SHOPEE_URL = "https://s.shopee.co.id/8plcY8LGXi";
    let adOpened = false;

    overlay.addEventListener("click", function () {
      if (adOpened) return;

      adOpened = true;
      window.open(SHOPEE_URL, "_blank", "noopener,noreferrer");
      overlay.classList.add("hidden");
      video.play().catch(() => {});
    }, { once: true });
  </script>

</body>
</html>
